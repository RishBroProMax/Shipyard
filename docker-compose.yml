# ============================================================
# Shipyard PaaS — Production Docker Compose Stack
# 
# Services:
#   - shipyard-app    : Next.js control plane + supervisor
#   - shipyard-db     : PostgreSQL 16 (persistent data)
#   - shipyard-redis  : Redis 7 (session cache, pub/sub)
#   - shipyard-proxy  : Caddy (reverse proxy + auto HTTPS)
#
# Usage:
#   docker compose up -d
#   docker compose logs -f shipyard-app
# ============================================================

version: "3.9"

services:
  # ── Shipyard App (Control Plane) ────────────────────────────────────────────
  shipyard-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: shipyard-app:latest
    container_name: shipyard-app
    restart: unless-stopped
    ports:
      - "${SHIPYARD_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - SHIPYARD_MODE=appliance
      - SHIPYARD_DATA_DIR=/var/lib/shipyard/data
      - SHIPYARD_ADMIN_EMAIL=${SHIPYARD_ADMIN_EMAIL:-admin@shipyard.local}
      - SHIPYARD_ADMIN_PASSWORD=${SHIPYARD_ADMIN_PASSWORD:-}
      - DATABASE_URL=postgresql://shipyard:${POSTGRES_PASSWORD:-changeme_in_production}@shipyard-db:5432/shipyard
      - REDIS_URL=redis://shipyard-redis:6379
      # JWT and encryption keys — generated on first boot if not provided
      - SHIPYARD_JWT_SECRET=${SHIPYARD_JWT_SECRET:-}
      - SHIPYARD_ENCRYPTION_KEY=${SHIPYARD_ENCRYPTION_KEY:-}
    volumes:
      # Persistent data directory (secrets, logs, app files, caddy config)
      - ${SHIPYARD_DATA_DIR:-/var/lib/shipyard/data}:/var/lib/shipyard/data
      # Docker socket so Shipyard can orchestrate container builds
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      shipyard-db:
        condition: service_healthy
      shipyard-redis:
        condition: service_healthy
    networks:
      - shipyard-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── PostgreSQL 16 ───────────────────────────────────────────────────────────
  shipyard-db:
    image: postgres:16-alpine
    container_name: shipyard-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=shipyard
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme_in_production}
      - POSTGRES_DB=shipyard
      # Tuning for small VPS (512MB RAM default tuning)
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=en_US.utf8 --lc-ctype=en_US.utf8
    volumes:
      - shipyard-pgdata:/var/lib/postgresql/data
    networks:
      - shipyard-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipyard -d shipyard"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── Redis 7 ─────────────────────────────────────────────────────────────────
  shipyard-redis:
    image: redis:7-alpine
    container_name: shipyard-redis
    restart: unless-stopped
    command: redis-server --save 60 1000 --loglevel warning
    volumes:
      - shipyard-redisdata:/data
    networks:
      - shipyard-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Caddy Reverse Proxy + Auto-HTTPS ────────────────────────────────────────
  shipyard-proxy:
    image: caddy:2-alpine
    container_name: shipyard-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 QUIC
    volumes:
      # Caddyfile is generated by install.sh and written to the data volume
      - ${SHIPYARD_DATA_DIR:-/var/lib/shipyard/data}:/var/lib/shipyard/data
      - shipyard-caddy:/data
      - shipyard-caddy-config:/config
    networks:
      - shipyard-net
    # Caddy will use the Caddyfile from the data dir; fallback to a simple reverse proxy
    command: >
      sh -c "
        CADDYFILE=/var/lib/shipyard/data/caddy/Caddyfile &&
        if [ ! -f \"$$CADDYFILE\" ]; then
          mkdir -p /var/lib/shipyard/data/caddy &&
          echo ':80 { reverse_proxy shipyard-app:3000 }' > \"$$CADDYFILE\"
        fi &&
        caddy run --config \"$$CADDYFILE\" --adapter caddyfile
      "
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

# ── Named Volumes (persistent across container restarts) ─────────────────────
volumes:
  shipyard-pgdata:
    name: shipyard-pgdata
  shipyard-redisdata:
    name: shipyard-redisdata
  shipyard-caddy:
    name: shipyard-caddy
  shipyard-caddy-config:
    name: shipyard-caddy-config

# ── Internal Network ─────────────────────────────────────────────────────────
networks:
  shipyard-net:
    name: shipyard-net
    driver: bridge
